# cava config for the saqib33w.mahtab visualizer.
# One raw ASCII frame per line: bands separated by ';', each value in
# 0..ascii_max_range. Service.qml parses that into the shader's bands.
#
# 30 fps matches the wallpaper motion timer: cava only feeds targets, the easing
# runs on that timer, so cava's own rate never shows through. noise_reduction
# smooths the band data itself, the same way the Ryoku shell's cava does.
[general]
framerate = 30
bars = 48

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 45
